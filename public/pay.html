<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay - x402 Web3 Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container { width: 100%; max-width: 420px; }
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .header {
      background: #f8fafc;
      padding: 24px 32px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
    }
    .header-text h1 { font-size: 16px; font-weight: 600; color: #1e293b; }
    .header-text p { font-size: 12px; color: #64748b; }
    .content { padding: 32px; }
    .merchant-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .merchant-icon {
      width: 48px;
      height: 48px;
      background: #f1f5f9;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .merchant-info h2 { font-size: 14px; font-weight: 500; color: #64748b; }
    .merchant-info p { font-size: 16px; font-weight: 600; color: #1e293b; }
    .amount-box {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
    }
    .amount-label {
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .amount-value { font-size: 48px; font-weight: 700; color: #1e293b; line-height: 1; }
    .amount-currency { font-size: 18px; font-weight: 500; color: #64748b; margin-left: 4px; }
    .network-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      color: #166534;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .network-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
    }
    .description-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .description-label {
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .description-value { font-size: 14px; color: #1e293b; }
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 18px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: inherit;
      margin-bottom: 12px;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
    }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-wc {
      background: #3b99fc;
    }
    .btn-wc:hover:not(:disabled) {
      box-shadow: 0 8px 24px rgba(59, 153, 252, 0.4);
    }
    .btn .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
    }
    .status.info { background: #e0f2fe; color: #0369a1; }
    .status.success { background: #dcfce7; color: #166534; }
    .status.error { background: #fee2e2; color: #dc2626; }
    .status.warning { background: #fef3c7; color: #d97706; }
    .paid-section { text-align: center; padding: 48px 32px; }
    .paid-icon {
      width: 80px;
      height: 80px;
      background: #dcfce7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    .paid-section h2 { font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
    .paid-section p { color: #64748b; margin-bottom: 24px; }
    .tx-link {
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      font-size: 12px;
      word-break: break-all;
    }
    .tx-link a { color: #667eea; text-decoration: none; }
    .expired-section { text-align: center; padding: 48px 32px; }
    .expired-icon { font-size: 64px; margin-bottom: 24px; }
    .expired-section h2 { font-size: 20px; font-weight: 600; color: #1e293b; margin-bottom: 8px; }
    .expired-section p { color: #64748b; }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
    }
    .loading p { color: #64748b; font-size: 14px; }
    .footer { padding: 16px 32px; border-top: 1px solid #e2e8f0; text-align: center; }
    .footer p { font-size: 11px; color: #94a3b8; }
    .wallet-info {
      background: #f0fdf4;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wallet-info-left { display: flex; align-items: center; gap: 8px; }
    .wallet-info-left span { font-size: 14px; color: #166534; font-family: monospace; }
    .disconnect-btn {
      background: none;
      border: 1px solid #dcfce7;
      color: #166534;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .disconnect-btn:hover { background: #dcfce7; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo">x</div>
        <div class="header-text">
          <h1>x402 Payment</h1>
          <p>Web3 Acquiriring</p>
        </div>
      </div>

      <div id="loading" class="loading">
        <p>Loading payment details...</p>
      </div>

      <div id="payment-info" class="hidden">
        <div class="content">
          <div class="merchant-row">
            <div class="merchant-icon">🏪</div>
            <div class="merchant-info">
              <h2>Merchant</h2>
              <p id="merchant-name">-</p>
            </div>
          </div>

          <div class="amount-box">
            <div class="amount-label">Amount</div>
            <div>
              <span class="amount-value" id="amount">-</span>
              <span class="amount-currency">USDC</span>
            </div>
          </div>

          <div class="network-badge" id="network-badge">Base Sepolia Testnet</div>

          <div class="description-box">
            <div class="description-label">Description</div>
            <div class="description-value" id="description">-</div>
          </div>

          <div id="wallet-info" class="wallet-info hidden">
            <div class="wallet-info-left">
              <span id="wallet-address">-</span>
            </div>
            <button class="disconnect-btn" id="disconnect-btn">Disconnect</button>
          </div>

          <button class="btn btn-wc" id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
          <button class="btn" id="pay-btn" onclick="pay()" disabled>Pay Now</button>

          <div id="status" class="status hidden"></div>
        </div>

        <div class="footer">
          <p>Powered by x402 Protocol</p>
        </div>
      </div>

      <div id="paid-info" class="hidden">
        <div class="paid-section">
          <div class="paid-icon">✓</div>
          <h2>Payment Complete!</h2>
          <p>Your payment has been processed successfully.</p>
          <div class="tx-link" id="tx-link"></div>
        </div>
      </div>

      <div id="expired-info" class="hidden">
        <div class="expired-section">
          <div class="expired-icon">⏱️</div>
          <h2>Payment Expired</h2>
          <p>This payment link is no longer valid.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.17.0/dist/wc-ethereum-provider.min.js"></script>

  <script>
    const paymentId = window.location.pathname.split('/').pop();
    const isMobile = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini/i.test(navigator.userAgent);

    const PERMIT2_ADDRESS = '0x000000000022D473030F116dDEE9F6B43aC78BA3';
    const X402_PROXY = '0x402085c248EeA27D92E8b30b2C58ed07f9E20001';
    const BASE_SEPOLIA_CHAIN_ID = '0x14a34';
    const BASE_SEPOLIA_CHAIN_ID_DECIMAL = 84532;
    // Free WalletConnect Project ID from https://cloud.walletconnect.com
    const WALLETCONNECT_PROJECT_ID = '2f05ae7f1116030fde2d36508f472bf1';

    let paymentData = null;
    let requirements = null;
    let walletProvider = null;
    let address = null;

    async function loadPayment() {
      try {
        const res = await fetch(`/api/payment-links/${paymentId}`);
        paymentData = await res.json();

        if (paymentData.status === 'paid') {
          showPaid(paymentData.tx_hash);
          return;
        }
        if (paymentData.status === 'expired') {
          showExpired();
          return;
        }

        document.getElementById('merchant-name').textContent = paymentData.merchant_id;
        document.getElementById('amount').textContent = parseFloat(paymentData.amount).toFixed(2);
        document.getElementById('description').textContent = paymentData.description || 'No description';

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('payment-info').classList.remove('hidden');
      } catch (err) {
        document.getElementById('loading').innerHTML = '<p>Error loading payment</p>';
      }
    }

    async function connectWallet() {
      const connectBtn = document.getElementById('connect-btn');

      try {
        connectBtn.disabled = true;
        connectBtn.innerHTML = '<span class="spinner"></span>Connecting...';
        showStatus('Opening wallet selector...', 'info');

        // Initialize WalletConnect v2 provider
        walletProvider = await WalletConnect.EthereumProvider.init({
          projectId: WALLETCONNECT_PROJECT_ID,
          chains: [BASE_SEPOLIA_CHAIN_ID_DECIMAL],
          optionalChains: [BASE_SEPOLIA_CHAIN_ID_DECIMAL],
          showQrModal: true,
          methods: ['eth_sendTransaction', 'personal_sign', 'eth_signTypedData'],
          events: ['accountsChanged', 'chainChanged'],
          metadata: {
            name: 'x402 Payment',
            description: 'Web3 Payment Gateway',
            url: window.location.origin,
            icons: ['https://x402.org/icon.png']
          }
        });

        // Enable session (opens QR modal on desktop, wallet selector on mobile)
        await walletProvider.enable();

        // Get accounts
        const accounts = walletProvider.accounts;
        if (accounts && accounts.length > 0) {
          address = accounts[0];
          showWalletConnected(address);
          connectBtn.classList.add('hidden');
          document.getElementById('pay-btn').disabled = false;
        }

        // Handle account changes
        walletProvider.on('accountsChanged', (accounts) => {
          if (accounts.length > 0) {
            address = accounts[0];
            showWalletConnected(address);
          } else {
            disconnectWallet();
          }
        });

        // Handle chain changes
        walletProvider.on('chainChanged', (chainId) => {
          if (parseInt(chainId) !== BASE_SEPOLIA_CHAIN_ID_DECIMAL) {
            switchToBaseSepolia();
          }
        });

      } catch (err) {
        console.error('Connect error:', err);
        connectBtn.disabled = false;
        connectBtn.textContent = 'Connect Wallet';

        if (err.code === 4001 || err.message?.includes('rejected') || err.message?.includes('denied')) {
          showStatus('Connection rejected', 'error');
        } else {
          showStatus(err.message || 'Failed to connect wallet', 'error');
        }
      }
    }

    function showWalletConnected(addr) {
      const walletInfo = document.getElementById('wallet-info');
      const walletAddress = document.getElementById('wallet-address');
      walletAddress.textContent = addr.slice(0, 6) + '...' + addr.slice(-4);
      walletInfo.classList.remove('hidden');
      showStatus('Wallet connected', 'success');
    }

    function disconnectWallet() {
      if (walletProvider) {
        walletProvider.disconnect();
        walletProvider = null;
      }
      address = null;

      document.getElementById('wallet-info').classList.add('hidden');
      document.getElementById('connect-btn').classList.remove('hidden');
      document.getElementById('connect-btn').disabled = false;
      document.getElementById('connect-btn').textContent = 'Connect Wallet';
      document.getElementById('pay-btn').disabled = true;
    }

    async function switchToBaseSepolia() {
      try {
        await walletProvider.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: BASE_SEPOLIA_CHAIN_ID }],
        });
      } catch (switchErr) {
        if (switchErr.code === 4902) {
          await walletProvider.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: BASE_SEPOLIA_CHAIN_ID,
              chainName: 'Base Sepolia',
              nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
              rpcUrls: ['https://sepolia.base.org'],
              blockExplorerUrls: ['https://sepolia.basescan.org'],
            }],
          });
        }
      }
    }

    async function pay() {
      const payBtn = document.getElementById('pay-btn');

      if (!address) {
        showStatus('Please connect wallet first', 'error');
        return;
      }

      try {
        payBtn.disabled = true;
        payBtn.innerHTML = '<span class="spinner"></span>Processing...';

        // Switch to Base Sepolia
        try {
          await walletProvider.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: BASE_SEPOLIA_CHAIN_ID }],
          });
        } catch (switchErr) {
          if (switchErr.code === 4902) {
            await walletProvider.request({
              method: 'wallet_addEthereumChain',
              params: [{
                chainId: BASE_SEPOLIA_CHAIN_ID,
                chainName: 'Base Sepolia',
                nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                rpcUrls: ['https://sepolia.base.org'],
                blockExplorerUrls: ['https://sepolia.basescan.org'],
              }],
            });
          }
        }

        showStatus('Getting payment info...', 'info');
        payBtn.innerHTML = '<span class="spinner"></span>Verifying...';

        const payRes = await fetch(`/pay/${paymentId}`);
        if (payRes.status === 200) {
          showPaid((await payRes.json()).tx_hash);
          return;
        }
        if (payRes.status !== 402) {
          throw new Error('Server error');
        }

        const header = payRes.headers.get('payment-required');
        const paymentRequired = JSON.parse(atob(header));
        requirements = paymentRequired.accepts[0];
        const amount = BigInt(requirements.amount);

        showStatus('Checking token allowance...', 'info');
        payBtn.innerHTML = '<span class="spinner"></span>Checking...';

        // Check allowance
        const allowanceData = await walletProvider.request({
          method: 'eth_call',
          params: [{
            to: requirements.asset,
            data: '0xdd62ed3e' + address.slice(2).padStart(64, '0') + PERMIT2_ADDRESS.slice(2).padStart(64, '0')
          }]
        });

        const currentAllowance = BigInt(allowanceData || '0x0');

        if (currentAllowance < amount) {
          showStatus('Approval required. Please confirm...', 'info');
          payBtn.innerHTML = '<span class="spinner"></span>Approving...';

          const approveData = {
            to: requirements.asset,
            from: address,
            data: '0x095ea7b3' + PERMIT2_ADDRESS.slice(2).padStart(64, '0') + 'ff'.repeat(32),
            value: '0x0'
          };

          await walletProvider.request({ method: 'eth_sendTransaction', params: [approveData] });
          showStatus('Waiting for approval...', 'info');
          await new Promise(r => setTimeout(r, 5000));
        }

        payBtn.innerHTML = '<span class="spinner"></span>Signing...';
        showStatus('Please sign in wallet...', 'info');

        const nonce = BigInt(ethers.utils.hexlify(ethers.utils.randomBytes(32)));
        const validAfter = Math.floor(Date.now() / 1000) - 600;
        const deadline = Math.floor(Date.now() / 1000) + 1800;
        const chainId = BASE_SEPOLIA_CHAIN_ID_DECIMAL;

        const domain = {
          name: 'Permit2',
          chainId: chainId,
          verifyingContract: PERMIT2_ADDRESS,
        };

        const types = {
          PermitWitnessTransferFrom: [
            { name: 'permitted', type: 'TokenPermissions' },
            { name: 'spender', type: 'address' },
            { name: 'nonce', type: 'uint256' },
            { name: 'deadline', type: 'uint256' },
            { name: 'witness', type: 'Witness' },
          ],
          TokenPermissions: [
            { name: 'token', type: 'address' },
            { name: 'amount', type: 'uint256' },
          ],
          Witness: [
            { name: 'to', type: 'address' },
            { name: 'validAfter', type: 'uint256' },
          ],
        };

        const message = {
          permitted: { token: requirements.asset, amount: requirements.amount },
          spender: X402_PROXY,
          nonce: nonce,
          deadline: deadline,
          witness: { to: requirements.payTo, validAfter: validAfter },
        };

        const signature = await walletProvider.request({
          method: 'eth_signTypedData',
          params: [address, { domain, types, message }]
        });

        payBtn.innerHTML = '<span class="spinner"></span>Submitting...';
        showStatus('Submitting payment...', 'info');

        const paymentPayload = {
          x402Version: 2,
          accepted: requirements,
          resource: paymentRequired.resource,
          payload: {
            signature,
            permit2Authorization: {
              from: address,
              permitted: { token: requirements.asset, amount: requirements.amount },
              spender: X402_PROXY,
              nonce: nonce.toString(),
              deadline: deadline,
              witness: { to: requirements.payTo, validAfter: validAfter },
            },
          },
        };

        const settleRes = await fetch(`/pay/${paymentId}`, {
          headers: { 'Payment-Signature': btoa(JSON.stringify(paymentPayload)) },
        });

        if (settleRes.status === 200) {
          showPaid((await settleRes.json()).tx_hash);
        } else {
          const err = await settleRes.json();
          throw new Error(err.error || 'Payment failed');
        }

      } catch (err) {
        payBtn.disabled = false;
        payBtn.textContent = 'Pay Now';

        if (err.code === 4001 || err.message?.includes('rejected') || err.message?.includes('denied')) {
          showStatus('Transaction rejected', 'error');
        } else {
          showStatus(err.message || 'Payment failed', 'error');
        }
      }
    }

    function showStatus(message, type) {
      const el = document.getElementById('status');
      el.className = `status ${type}`;
      el.textContent = message;
      el.classList.remove('hidden');
    }

    function showPaid(txHash) {
      document.getElementById('payment-info').classList.add('hidden');
      document.getElementById('paid-info').classList.remove('hidden');
      if (txHash) {
        document.getElementById('tx-link').innerHTML =
          `<a href="https://sepolia.basescan.org/tx/${txHash}" target="_blank">View Transaction →</a>`;
      }
    }

    function showExpired() {
      document.getElementById('payment-info').classList.add('hidden');
      document.getElementById('expired-info').classList.remove('hidden');
    }

    document.getElementById('disconnect-btn').addEventListener('click', disconnectWallet);

    loadPayment();
  </script>
</body>
</html>
